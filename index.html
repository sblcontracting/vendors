<!DOCTYPE html>
<html lang="en" data-api="https://script.google.com/macros/s/AKfycbyrz2iSNbGoUWkCa0-xNuhGQD365SfZ_T6ygPC-9dMTXEysnAxX1YKDWMKS3XPsf0I2/exec">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBL Vendors</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo-gold.png">
<style>
:root{--bg:#f4f1ea;--card:#fff;--grid:#ece6d8;--ink:#141414;--ink2:#1f1f22;--tx:#1d1d1f;--muted:#857d6c;--gold:#c9a24a;--gold2:#e8cd8c;--gold3:#b08a2e;--goldbg:#fbf6ea;
  --worked:#e7f4ea;--workedtx:#1e7a3c;--contacted:#fdf3dc;--contactedtx:#9a6400;--new:#eaf1fd;--newtx:#1f5fc4;--no:#fde9e7;--notx:#c0352b;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 "Changa",Tahoma,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
button,input,select{font:inherit}
.hdr{background:linear-gradient(135deg,#0d0d0f 0%,#1d1d21 60%,#2a2620 100%);color:#fff;padding:14px 20px 12px;border-bottom:2px solid var(--gold)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:46px;width:auto;filter:drop-shadow(0 2px 6px rgba(201,162,74,.35))}
.brand .nm1{font-weight:600;font-size:16px;letter-spacing:.2px}
.brand .nm2{color:var(--gold2);font-size:12.5px;opacity:.9}
.nm1,.nm2{unicode-bidi:plaintext}
.brand .ttl{margin-inline-start:auto;text-align:end;display:flex;align-items:center;gap:12px}
.brand .ttl b{display:block;font-size:22px;font-weight:600;background:linear-gradient(160deg,var(--gold2),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.bar{display:flex;align-items:center;gap:8px;padding:12px 20px;flex-wrap:wrap}
.bar input,.bar select{height:36px;border:1px solid var(--grid);border-radius:12px;background:#fff;color:var(--tx);padding:0 12px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.bar input:focus,.bar select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.18)}
.bar input[type=search]{width:240px}
.btn{height:36px;border:1px solid #2c2c30;border-radius:12px;background:var(--ink2);color:#fff;padding:0 14px;cursor:pointer;white-space:nowrap;transition:transform .15s var(--ease),filter .2s,background .2s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(160deg,var(--gold2),var(--gold3));border-color:var(--gold3);color:#141414;font-weight:600}
.btn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#ddd}
.sp{flex:1}
.langsw{display:flex;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:12px;padding:3px}
.langsw button{height:28px;border:0;background:transparent;color:#bbb;border-radius:9px;padding:0 10px;cursor:pointer;transition:background .2s var(--ease),color .2s}
.langsw button.sel{background:linear-gradient(160deg,var(--gold2),var(--gold3));color:#141414}
.info{display:flex;gap:14px;align-items:center;padding:0 22px 8px;color:var(--muted);font-size:12.5px}
.info b{color:var(--gold3);font-size:14px}
#status{margin-inline-start:auto;color:var(--gold3);transition:opacity .3s}
.card{flex:1;margin:0 20px 20px;background:var(--card);border:1px solid var(--grid);border-radius:18px;box-shadow:0 10px 30px rgba(40,30,10,.07);overflow:hidden;display:flex;min-height:0}
.wrap{flex:1;overflow:auto;scroll-behavior:smooth}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}
th,td{border-inline-end:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0 10px;height:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
th{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--gold2);font-weight:500;text-align:start;cursor:pointer;user-select:none;height:42px;border-color:#2a2a2e;transition:background .2s}
th:hover{background:#232327}
th .ar{color:var(--gold);font-size:10px;margin-inline-start:4px}
td.rn,th.rn{position:sticky;inset-inline-start:0;z-index:1;background:#faf8f2;color:var(--muted);text-align:center;width:48px;cursor:default;font-size:12px;padding:0}
th.rn{z-index:3;background:var(--ink);color:var(--gold)}
td.nm,th.nm{position:sticky;inset-inline-start:48px;z-index:1;background:#fff;font-weight:600}
th.nm{z-index:3;background:var(--ink)}
tbody tr td{transition:background .18s var(--ease)}
tbody tr:hover td{background:var(--goldbg)}
tbody tr:hover td.rn{background:#f3ead2;color:var(--gold3)}
td.ed{cursor:cell}
td.focus{box-shadow:inset 0 0 0 2px var(--gold)}
td input,td select{width:100%;height:30px;border:1px solid var(--gold);border-radius:8px;outline:0;padding:0 6px;background:#fff;font:inherit;box-shadow:0 0 0 3px rgba(201,162,74,.18)}
td.st{text-align:center}
td.st span{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:500}
td.st.worked span{background:var(--worked);color:var(--workedtx)}
td.st.contacted span{background:var(--contacted);color:var(--contactedtx)}
td.st.new span{background:var(--new);color:var(--newtx)}
td.st.no span{background:var(--no);color:var(--notx)}
td[data-k=rating]{color:var(--gold);letter-spacing:1px}
td[data-k=phone],td[data-k=email],td[data-k=cr],td[data-k=vat]{direction:ltr;unicode-bidi:isolate}
html[dir=rtl] td[data-k=phone],html[dir=rtl] td[data-k=email],html[dir=rtl] td[data-k=cr],html[dir=rtl] td[data-k=vat]{text-align:right}
td.act{text-align:center;padding:0}
td.act a,td.act button{border:0;background:none;cursor:pointer;color:#b3aa96;font-size:15px;padding:0 4px;text-decoration:none;transition:color .15s,transform .15s var(--ease)}
td.act a:hover,td.act button:hover{color:var(--gold3);transform:scale(1.15)}
td a.ln{color:var(--gold3);text-decoration:none}
tr.saving td{opacity:.55}
tr.newrow td{background:#fff8e3}
@keyframes rowin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
tbody tr{animation:rowin .35s var(--ease) both}
.empty{padding:50px;text-align:center;color:var(--muted)}
.lockpg{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%,#2a2620 0%,#0d0d0f 65%)}
.lock{width:100%;max-width:360px;background:linear-gradient(160deg,#1b1b1f,#111113);border:1px solid rgba(201,162,74,.35);border-radius:24px;padding:28px 26px;text-align:center;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rowin .5s var(--ease) both}
.lock img{height:72px;margin-bottom:10px}
.lock .nm1{font-weight:600}.lock .nm2{color:var(--gold2);font-size:12.5px;margin-bottom:16px}
.lock h1{margin:0 0 4px;font-size:24px;font-weight:600;background:linear-gradient(160deg,var(--gold2),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lock p{margin:0 0 16px;color:#a9a294;font-size:13px}
.lock input{width:100%;height:44px;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:0 14px;margin-bottom:10px;background:rgba(255,255,255,.06);color:#fff;text-align:center;letter-spacing:1px;transition:border-color .2s,box-shadow .2s}
.lock input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.25)}
.lock .btn{width:100%;height:44px;border-radius:14px}
.lock .msg{color:#ff8a80;min-height:20px;margin-bottom:6px;font-size:13px}
.lock .langsw{margin:0 auto 18px;width:max-content}
@media (max-width:760px){.hdr{padding:12px 14px}.brand img{height:38px}.brand .nm1{font-size:14px}.brand .nm2{display:none}.brand .ttl b{font-size:18px}.bar{padding:10px 12px}.bar input[type=search]{width:100%;order:-1}.card{margin:0 8px 10px;border-radius:14px}.info{padding:0 14px 6px}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileIn" hidden>
<script>
const API = document.documentElement.dataset.api || '';
const DEMO = !API;
const TYPES=['Subcontractor','Material supplier','Equipment rental','Manpower supply','Services','Other'];
const STATUS=[['worked','Worked with'],['contacted','Contacted'],['new','New'],['no','Not recommended']];
const COLS=[ // key, label, width, kind
 ['name','Company',260,'text'],['type','Type',140,'type'],['specialties','Specialties',170,'text'],['cities','City',110,'text'],
 ['contact','Contact person',140,'text'],['phone','Mobile',120,'text'],['email','Email',200,'text'],['status','Status',120,'status'],
 ['rating','Rating',70,'rating'],['cr','CR no.',110,'text'],['vat','VAT no.',140,'text'],['lastContact','Last contact',110,'date'],
 ['source','Source',230,'text'],['notes','Notes',300,'text']];
const AR={"Vendors":"الموردون","Company":"الشركة","Type":"النوع","Specialties":"التخصصات","City":"المدينة","Contact person":"المسؤول","Mobile":"الجوال","Email":"الإيميل",
 "Status":"الحالة","Rating":"التقييم","CR no.":"السجل التجاري","VAT no.":"الرقم الضريبي","Last contact":"آخر تواصل","Source":"المصدر","Notes":"ملاحظات",
 "Subcontractor":"مقاول باطن","Material supplier":"مورد مواد","Equipment rental":"تأجير معدات","Manpower supply":"توريد عمالة","Services":"خدمات","Other":"أخرى",
 "Worked with":"تعاملنا معه","Contacted":"تواصلنا","New":"جديد","Not recommended":"لا ننصح به","All types":"كل الأنواع","All statuses":"كل الحالات",
 "Search…":"بحث…","+ Add row":"+ إضافة صف","Export to Excel":"تصدير إلى Excel","Lock":"قفل","rows":"صف","Saving…":"جارٍ الحفظ…","Saved":"تم الحفظ",
 "Could not save":"تعذّر الحفظ","Uploading…":"جارٍ الرفع…","Uploaded":"تم الرفع","Archive this row?":"أرشفة هذا الصف؟","Archived":"تمت الأرشفة",
 "Access code":"رمز الدخول","Open":"فتح","Wrong code":"رمز غير صحيح","Enter the access code":"أدخل رمز الدخول","Could not reach the server.":"تعذّر الاتصال بالخادم.",
 "No rows.":"لا توجد صفوف.","Double-click a cell to edit. Enter saves, Esc cancels.":"انقر مرتين على الخانة للتعديل. Enter للحفظ و Esc للإلغاء.",
 "Upload document":"رفع مستند","Open folder":"فتح المجلد","Archive":"أرشفة","Company name is required.":"اسم الشركة مطلوب.","Loading…":"جارٍ التحميل…"};
let LANG='en'; const T=s=>LANG==='ar'&&AR[s]?AR[s]:s;
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY=''; try{KEY=localStorage.getItem('sblVendKey')||''}catch(e){}
let ROWS=[], VIEW=[]; const F={q:'',type:'',status:''}; let SORT={k:'name',d:1};

async function api(action,payload){
  if(DEMO){let all;try{all=JSON.parse(localStorage.getItem('sblVendDemo2')||'null')}catch(e){}
    if(!all) all=[{id:'d1',name:'Al Noor Fiber Contracting',type:'Subcontractor',specialties:'Fiber optics',cities:'Riyadh',contact:'Ahmed',phone:'0500000001',status:'worked',rating:4,source:'Referral'},
                  {id:'d2',name:'Sun Peak Solar',type:'Material supplier',specialties:'Solar PV',cities:'Jeddah',status:'contacted',rating:0}];
    const keep=()=>{try{localStorage.setItem('sblVendDemo2',JSON.stringify(all))}catch(e){}};
    if(action==='list') return {ok:true,vendors:all};
    if(action==='save'){const v=payload.vendor;if(!v.id)v.id='d'+Date.now();const i=all.findIndex(x=>x.id===v.id);if(i<0)all.push(v);else all[i]=v;keep();return {ok:true,vendor:v}}
    if(action==='archive'){all=all.filter(x=>x.id!==payload.id);keep();return {ok:true}}
    if(action==='upload') return {ok:true,url:'#'};
    return {ok:false}}
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({key:KEY,action},payload||{})),credentials:'omit',redirect:'follow'});
  return r.json();
}
function setStatus(t,err){const s=$('#status');if(!s)return;s.textContent=t;s.style.color=err?'var(--notx)':'';clearTimeout(setStatus.t);if(!err&&t===T('Saved'))setStatus.t=setTimeout(()=>s.textContent='',2000)}
const BRAND=()=>`<img src="logo-gold.png" alt="SBL"><div><div class="nm1">${LANG==='ar'?'شركة خطوط البناء الذكي للمقاولات':'Smart Building Lines Contracting Co.'}</div><div class="nm2">${LANG==='ar'?'Smart Building Lines Contracting Co.':'شركة خطوط البناء الذكي للمقاولات'}</div></div>`;
function langBtns(){return `<div class="langsw"><button data-l="en" class="${LANG==='en'?'sel':''}">EN</button><button data-l="ar" class="${LANG==='ar'?'sel':''}">عربي</button></div>`}
function bindLang(){document.querySelectorAll('.langsw button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('sblLang',LANG)}catch(e){};applyLang();render()})}
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr'}

function render(){ if(!DEMO&&!KEY) return renderLock(); renderTable(); }

function renderLock(){
  $('#app').innerHTML=`<div class="lockpg"><div class="lock">${langBtns()}<img src="logo-gold.png" alt="SBL"><div class="nm1">${LANG==='ar'?'شركة خطوط البناء الذكي للمقاولات':'Smart Building Lines Contracting Co.'}</div><div class="nm2">${LANG==='ar'?'Smart Building Lines Contracting Co.':'شركة خطوط البناء الذكي للمقاولات'}</div><h1>${T('Vendors')}</h1><p>${T('Enter the access code')}</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="${T('Access code')}"><div class="msg" id="km"></div><button class="btn gold" id="open">${T('Open')}</button></div></div>`;
  bindLang(); $('#key').onkeydown=e=>{if(e.key==='Enter')$('#open').click()}; $('#key').focus();
  $('#open').onclick=async()=>{KEY=$('#key').value.trim();if(!KEY)return;$('#open').textContent=T('Loading…');
    try{const r=await api('list');if(r.ok){try{localStorage.setItem('sblVendKey',KEY)}catch(e){}ROWS=r.vendors||[];render()}else{KEY='';$('#km').textContent=T('Wrong code');$('#open').textContent=T('Open')}}
    catch(e){KEY='';$('#km').textContent=T('Could not reach the server.');$('#open').textContent=T('Open')}};
}

function statusLabel(s){const x=STATUS.find(a=>a[0]===s);return x?T(x[1]):(s||'')}
function cellText(v,c){const k=c[0],x=v[k];
  if(c[3]==='type') return esc(T(x||''));
  if(c[3]==='status') return x?`<span>${esc(statusLabel(x))}</span>`:'';
  if(c[3]==='rating') return x>0?'★'.repeat(x):'';
  if(k==='email'&&x) return `<a class="ln" href="mailto:${esc(x)}">${esc(x)}</a>`;
  return esc(x||'');}

function filterRows(){
  const q=F.q.trim().toLowerCase();
  VIEW=ROWS.filter(v=>(!F.type||v.type===F.type)&&(!F.status||v.status===F.status)&&
    (!q||COLS.some(c=>String(v[c[0]]||'').toLowerCase().includes(q))));
  const k=SORT.k,d=SORT.d;
  VIEW.sort((a,b)=>{let x=a[k],y=b[k];if(k==='rating'){x=+x||0;y=+y||0;return (x-y)*d}
    return String(x||'').localeCompare(String(y||''),LANG,{numeric:true,sensitivity:'base'})*d});
}

function renderTable(){
  filterRows();
  const w=44+COLS.reduce((s,c)=>s+c[2],0)+70;
  $('#app').innerHTML=`<div class="hdr"><div class="brand">${BRAND()}<div class="ttl"><b>${T('Vendors')}</b>${langBtns()}${DEMO?'':`<button class="btn ghost" id="lock">${T('Lock')}</button>`}</div></div></div><div class="bar">
    <input type="search" id="q" placeholder="${T('Search…')}" value="${esc(F.q)}">
    <select id="ft"><option value="">${T('All types')}</option>${TYPES.map(t=>`<option value="${t}" ${F.type===t?'selected':''}>${T(t)}</option>`).join('')}</select>
    <select id="fs"><option value="">${T('All statuses')}</option>${STATUS.map(s=>`<option value="${s[0]}" ${F.status===s[0]?'selected':''}>${T(s[1])}</option>`).join('')}</select>
    <button class="btn gold" id="add">${T('+ Add row')}</button><button class="btn" id="xls">${T('Export to Excel')}</button>
    </div>
   <div class="info"><span><b id="cnt">${VIEW.length}</b> ${T('rows')}</span><span>${T('Double-click a cell to edit. Enter saves, Esc cancels.')}</span><span id="status"></span></div>
   <div class="card"><div class="wrap"><table style="width:${w}px"><colgroup><col style="width:44px">${COLS.map(c=>`<col style="width:${c[2]}px">`).join('')}<col style="width:70px"></colgroup>
   <thead><tr><th class="rn">#</th>${COLS.map(c=>`<th data-k="${c[0]}" class="${c[0]==='name'?'nm':''}">${T(c[1])}${SORT.k===c[0]?`<span class="ar">${SORT.d>0?'▲':'▼'}</span>`:''}</th>`).join('')}<th></th></tr></thead>
   <tbody id="tb">${VIEW.length?VIEW.map(rowHtml).join(''):`<tr><td colspan="${COLS.length+2}" class="empty">${T('No rows.')}</td></tr>`}</tbody></table></div></div>`;
  bindLang();
  $('#q').oninput=e=>{F.q=e.target.value;refreshBody()};
  $('#ft').onchange=e=>{F.type=e.target.value;refreshBody()};
  $('#fs').onchange=e=>{F.status=e.target.value;refreshBody()};
  $('#add').onclick=addRow; $('#xls').onclick=exportCsv;
  if($('#lock')) $('#lock').onclick=()=>{KEY='';try{localStorage.removeItem('sblVendKey')}catch(e){};ROWS=[];render()};
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;SORT=SORT.k===k?{k,d:-SORT.d}:{k,d:1};renderTable()});
  bindBody();
}
function refreshBody(){filterRows();$('#cnt').textContent=VIEW.length;
  $('#tb').innerHTML=VIEW.length?VIEW.map(rowHtml).join(''):`<tr><td colspan="${COLS.length+2}" class="empty">${T('No rows.')}</td></tr>`;bindBody()}
function rowHtml(v,i){
  return `<tr data-id="${esc(v.id||'')}" class="${v.id?'':'newrow'}"><td class="rn">${i+1}</td>${COLS.map(c=>`<td class="ed ${c[0]==='name'?'nm':''} ${c[3]==='status'?'st '+esc(v.status||''):''}" data-k="${c[0]}" title="${esc(c[3]==='status'?statusLabel(v[c[0]]):(c[3]==='type'?T(v[c[0]]||''):(v[c[0]]||'')))}">${cellText(v,c)}</td>`).join('')}
   <td class="act">${v.folder?`<a href="${esc(v.folder)}" target="_blank" rel="noopener" title="${T('Open folder')}">📁</a>`:''}<button data-up title="${T('Upload document')}">📎</button><button data-del title="${T('Archive')}">🗑</button></td></tr>`;
}
function rowOf(el){const id=el.closest('tr').dataset.id;return id?ROWS.find(v=>v.id===id):ROWS.find(v=>!v.id)}
function bindBody(){
  document.querySelectorAll('#tb td.ed').forEach(td=>{td.ondblclick=()=>editCell(td);td.onclick=()=>{document.querySelectorAll('td.focus').forEach(x=>x.classList.remove('focus'));td.classList.add('focus')}});
  document.querySelectorAll('#tb [data-del]').forEach(b=>b.onclick=()=>archiveRow(rowOf(b)));
  document.querySelectorAll('#tb [data-up]').forEach(b=>b.onclick=()=>uploadFor(rowOf(b)));
}
function editCell(td){
  if(td.querySelector('input,select')) return;
  const v=rowOf(td), k=td.dataset.k, c=COLS.find(x=>x[0]===k), old=v[k]==null?'':String(v[k]);
  let inp;
  if(c[3]==='type'){inp=document.createElement('select');inp.innerHTML=`<option value=""></option>`+TYPES.map(t=>`<option value="${t}">${T(t)}</option>`).join('')}
  else if(c[3]==='status'){inp=document.createElement('select');inp.innerHTML=STATUS.map(s=>`<option value="${s[0]}">${T(s[1])}</option>`).join('')}
  else if(c[3]==='rating'){inp=document.createElement('select');inp.innerHTML=[0,1,2,3,4,5].map(n=>`<option value="${n}">${n?'★'.repeat(n):'–'}</option>`).join('')}
  else {inp=document.createElement('input');inp.type=c[3]==='date'?'date':'text'}
  inp.value=old; td.textContent=''; td.appendChild(inp); inp.focus(); if(inp.select&&inp.type==='text')inp.select();
  let done=false;
  const finish=async save=>{if(done)return;done=true;const nv=inp.value.trim();
    if(!save||nv===old){if(!v.id&&!nv&&k==='name'){ROWS=ROWS.filter(x=>x!==v);return refreshBody()}td.innerHTML=cellText(v,c);return}
    v[k]=c[3]==='rating'?Number(nv):nv; td.innerHTML=cellText(v,c); if(c[3]==='status') td.className='ed st '+nv;
    await saveRow(v,td.closest('tr'));};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish(true)}else if(e.key==='Escape'){finish(false)}};
  inp.onblur=()=>finish(true);
  if(inp.tagName==='SELECT') inp.onchange=()=>finish(true);
}
async function saveRow(v,tr){
  if(!v.name||!String(v.name).trim()){setStatus(T('Company name is required.'),true);return}
  setStatus(T('Saving…')); if(tr) tr.classList.add('saving');
  const wasNew=!v.id;
  try{const r=await api('save',{vendor:Object.assign({},v)}); if(!r.ok) throw new Error(r.error||'');
    Object.assign(v,r.vendor); setStatus(T('Saved'));
    if(tr){tr.classList.remove('saving');if(wasNew){tr.dataset.id=v.id;tr.classList.remove('newrow')}}}
  catch(e){setStatus(T('Could not save')+(e.message?': '+e.message:''),true);if(tr)tr.classList.remove('saving')}
}
function addRow(){
  if(ROWS.some(v=>!v.id)) return;
  F.q='';F.type='';F.status='';
  ROWS.unshift({name:'',type:'',status:'new',rating:0}); SORT={k:'',d:1};
  renderTable(); const td=document.querySelector('#tb tr.newrow td[data-k="name"]'); if(td) editCell(td);
}
async function archiveRow(v){
  if(!v) return; if(!v.id){ROWS=ROWS.filter(x=>x!==v);return refreshBody()}
  if(!confirm(T('Archive this row?')+'\n'+v.name)) return;
  setStatus(T('Saving…'));
  try{const r=await api('archive',{id:v.id});if(!r.ok)throw new Error(r.error||'');ROWS=ROWS.filter(x=>x!==v);refreshBody();setStatus(T('Archived'))}
  catch(e){setStatus(T('Could not save'),true)}
}
function uploadFor(v){
  if(!v||!v.id) return; const fi=$('#fileIn'); fi.value='';
  fi.onchange=async()=>{const f=fi.files[0];if(!f)return;if(f.size>10*1024*1024){setStatus('Max 10 MB',true);return}
    setStatus(T('Uploading…'));
    const b64=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(f)});
    try{const r=await api('upload',{id:v.id,fileName:f.name,mime:f.type||'application/octet-stream',file:b64});if(!r.ok)throw new Error(r.error||'');
      if(r.url){v.folder=r.url} refreshBody(); setStatus(T('Uploaded'))}
    catch(e){setStatus(T('Could not save')+(e.message?': '+e.message:''),true)}};
  fi.click();
}
function exportCsv(){
  const head=COLS.map(c=>T(c[1])), q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')].concat(VIEW.map(v=>COLS.map(c=>{let x=v[c[0]];if(c[3]==='type')x=T(x||'');if(c[3]==='status')x=statusLabel(x);
    if((c[0]==='phone'||c[0]==='vat'||c[0]==='cr')&&x) x='\t'+x; return q(x)}).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SBL Vendors.csv';document.body.appendChild(a);a.click();a.remove();
}

(async()=>{try{LANG=localStorage.getItem('sblLang')||(/^ar/i.test(navigator.language)?'ar':'en')}catch(e){}
  applyLang();
  if(DEMO||KEY){$('#app').innerHTML=`<div class="empty">${T('Loading…')}</div>`;
    try{const r=await api('list');if(r.ok)ROWS=r.vendors||[];else{KEY='';try{localStorage.removeItem('sblVendKey')}catch(e){}}}catch(e){}}
  render();
})();
</script>
